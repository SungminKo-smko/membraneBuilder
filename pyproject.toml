[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "membrane-builder-mcp"
version = "0.1.0"
description = "MCP server for building lipid bilayer membranes using AmberTools packmol-memgen with GROMACS output"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
openmm = ["openmm>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/membrane_builder_mcp"]
